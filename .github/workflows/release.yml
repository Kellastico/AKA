name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build all platforms for and attach assets to, e.g. v1.2.1. Builds the current main.'
        required: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            sidecar_triple: 'aarch64-apple-darwin'
          - platform: macos-13
            args: '--target x86_64-apple-darwin'
            sidecar_triple: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            sidecar_triple: 'x86_64-unknown-linux-gnu'
          - platform: windows-latest
            args: '--bundles nsis'
            sidecar_triple: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.sidecar_triple }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        # NOTE: no pipewire packages — the aka-tool shim's screenshot engine
        # (xcap) is compiled on macOS/Windows only. xcap's Linux backend needs
        # pipewire/libspa bindings newer than LTS headers provide (libspa-0.9
        # fails to compile against 22.04's pipewire 0.3.48), so capture-window
        # answers "not supported on this platform" on Linux instead.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build aka-runtime sidecar
        shell: bash
        run: bash src-tauri/scripts/rename-runtime.sh ${{ matrix.sidecar_triple }}

      - name: Build aka-tool shim
        shell: bash
        run: bash src-tauri/scripts/build-tool.sh ${{ matrix.sidecar_triple }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Load release notes
        id: notes
        shell: bash
        run: |
          FILE=".github/RELEASE_NOTES_${{ github.event.inputs.tag || github.ref_name }}.md"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            if [[ -f "$FILE" ]]; then cat "$FILE"; else echo "${{ github.ref_name }}"; fi
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- Apple code signing + notarization ----
          # When these secrets are present, tauri-action imports the Developer ID
          # cert and signs the app + sidecars under the hardened runtime, then
          # notarizes and staples the *.app*. See .github/MACOS_SIGNING.md.
          #
          # NOTE: tauri-action notarizes the .app but NOT the .dmg wrapper — a
          # downloaded, quarantined un-notarized DMG still fails to mount with
          # "the disk image is corrupted". The "Notarize + staple DMG" step below
          # closes that gap.
          #
          # Only the macOS legs consume these; on Linux/Windows they're ignored.
          # If the secrets are ever cleared, they resolve to empty strings and
          # tauri-action falls back to an unsigned bundle instead of failing —
          # but keep all six set together (a cert with an empty SIGNING_IDENTITY
          # is the half-config that broke earlier builds).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Publish directly instead of leaving a draft to publish by hand.
          # tauri-action defaults releaseDraft to true; flip it off so a
          # successful multi-platform build goes live on its own.
          releaseDraft: false
          args: ${{ matrix.args }}

      # tauri-action notarizes the .app but leaves the .dmg wrapper un-notarized,
      # so a browser-downloaded DMG still hits Gatekeeper's "disk image is
      # corrupted". Submit the finished DMG to the notary service, staple the
      # ticket, and re-upload the stapled asset over the one tauri-action just
      # published. macOS legs only; no-ops cleanly if the secrets are absent.
      - name: Notarize + staple DMG (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple notary credentials absent — unsigned build, skipping DMG notarization."
            exit 0
          fi
          DMG=$(find "src-tauri/target/${{ matrix.sidecar_triple }}/release/bundle/dmg" -name '*.dmg' | head -n1)
          if [ -z "$DMG" ]; then
            echo "No DMG produced for this target — skipping."
            exit 0
          fi
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"
          echo "Re-uploading stapled DMG to release $TAG"
          gh release upload "$TAG" "$DMG" --clobber
