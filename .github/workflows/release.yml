name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build all platforms for and attach assets to, e.g. v1.2.1. Builds the current main.'
        required: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            sidecar_triple: 'aarch64-apple-darwin'
          - platform: macos-13
            args: '--target x86_64-apple-darwin'
            sidecar_triple: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            sidecar_triple: 'x86_64-unknown-linux-gnu'
          - platform: windows-latest
            args: '--bundles nsis'
            sidecar_triple: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.sidecar_triple }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build aka-runtime sidecar
        shell: bash
        run: bash src-tauri/scripts/rename-runtime.sh ${{ matrix.sidecar_triple }}

      - name: Build aka-tool shim
        shell: bash
        run: bash src-tauri/scripts/build-tool.sh ${{ matrix.sidecar_triple }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Load release notes
        id: notes
        shell: bash
        run: |
          FILE=".github/RELEASE_NOTES_${{ github.event.inputs.tag || github.ref_name }}.md"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            if [[ -f "$FILE" ]]; then cat "$FILE"; else echo "${{ github.ref_name }}"; fi
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- Apple code signing + notarization (TEMPORARILY DISABLED) ----
          # Signing is OFF for now: the Apple secrets were half-configured
          # (empty APPLE_SIGNING_IDENTITY + a cert that failed `security import`),
          # which broke the macOS build instead of falling back cleanly. With the
          # APPLE_* env removed, tauri-action skips signing and produces an
          # unsigned (ad-hoc) bundle, so the macOS legs build successfully.
          #
          # The repo secrets are left intact. To re-enable signed + notarized
          # builds, fix the 6 secrets per .github/MACOS_SIGNING.md and restore
          # the APPLE_* env lines below:
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Publish directly instead of leaving a draft to publish by hand.
          # tauri-action defaults releaseDraft to true; flip it off so a
          # successful multi-platform build goes live on its own.
          releaseDraft: false
          args: ${{ matrix.args }}
